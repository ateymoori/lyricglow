appId: com.lyricglow.app
productName: LyricGlow
directories:
  buildResources: build
  output: release
files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
  - "!dist/mac/**/*"
  - "!dist/mac-arm64/**/*"
  - "!dist/*.dmg"
  - "!dist/*.yml"
  - resources/**/*
  - .env
  - node_modules/electron-log/**/*
  - node_modules/electron-store/**/*
  - node_modules/node-fetch/**/*
  - "!node_modules/vazirmatn/**/*"
  - "!node_modules/@fontsource/**/*"
  - package.json
extraResources:
  - from: build/iconTemplate.png
    to: iconTemplate.png
  - from: build/iconTemplate@2x.png
    to: iconTemplate@2x.png
mac:
  category: public.app-category.music
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  artifactName: ${productName}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  identity: null
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSAppleEventsUsageDescription: "This app needs to access music players to display currently playing tracks."
    LSUIElement: true
dmg:
  title: ${productName} ${version}
  icon: build/icon.icns
  background: build/dmg-background.png
  contents:
    - x: 165
      y: 195
    - x: 465
      y: 195
      type: link
      path: /Applications
  window:
    width: 660
    height: 440
  writeUpdateInfo: false